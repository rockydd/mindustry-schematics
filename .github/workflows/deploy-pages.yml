name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # GitHub still runs the legacy "pages-build-deployment" Jekyll publisher
      # from the repo root on some repos. That upload includes source index.html
      # (/src/main.tsx) and overwrites this Vite artifact if it finishes last.
      # Wait until it is done so our dist/ deploy is the last write.
      - name: Wait for legacy Pages builder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          seen=0
          for i in $(seq 1 48); do
            in_progress=$(gh run list --workflow "pages-build-deployment" --branch "${GITHUB_REF_NAME}" --status in_progress --json databaseId --jq 'length' 2>/dev/null || echo "0")
            queued=$(gh run list --workflow "pages-build-deployment" --branch "${GITHUB_REF_NAME}" --status queued --json databaseId --jq 'length' 2>/dev/null || echo "0")
            echo "wait $i: pages-build-deployment in_progress=${in_progress} queued=${queued}"
            if [ "${in_progress}" != "0" ] || [ "${queued}" != "0" ]; then
              seen=1
            fi
            if [ "${seen}" = "1" ] && [ "${in_progress}" = "0" ] && [ "${queued}" = "0" ]; then
              echo "Legacy Pages builder finished; deploying Vite artifact last."
              sleep 5
              exit 0
            fi
            # If it never appears, it is not going to run for this push.
            if [ "${seen}" = "0" ] && [ "$i" -ge 6 ]; then
              echo "No pages-build-deployment run observed; deploying."
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for pages-build-deployment; deploying anyway."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
